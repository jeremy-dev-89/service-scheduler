name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - name: OpenAPI contract has not drifted from the code
        run: npm run openapi:export && git diff --exit-code openapi.yaml

      - name: Pull the PostgreSQL image used by Testcontainers
        run: docker pull postgres:17

      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:acceptance
      - run: npm run test:concurrency
